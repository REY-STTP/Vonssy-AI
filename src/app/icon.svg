<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="markGradient" x1="20" y1="14" x2="80" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E89A6C"/>
      <stop offset="0.55" stop-color="#D97B54"/>
      <stop offset="1" stop-color="#C15F3C"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50" cy="30" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232019"/>
      <stop offset="1" stop-color="#1A1918"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bgGlow)"/>

  <!-- three crown spikes: multiple AI providers converging -->
  <path d="M 30 46 L 25.5 29 L 35.5 39.5 Z" fill="url(#markGradient)"/>
  <path d="M 50 24 L 58.5 36 L 50 42 L 41.5 36 Z" fill="url(#markGradient)"/>
  <path d="M 70 46 L 74.5 29 L 64.5 39.5 Z" fill="url(#markGradient)"/>

  <!-- unified V: one interface -->
  <path d="M 28 46 L 50 76 L 72 46" fill="none" stroke="url(#markGradient)"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
